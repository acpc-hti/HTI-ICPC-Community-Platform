<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تحويل إلى بوابة الطلاب والحساب الشخصي | HTI ICPC Community</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const appId = params.get('appId') || params.get('studentId') || '';
    const token = params.get('token') || '';
    let target = 'portal.html';
    if (appId && token) {
      target += `?studentId=${encodeURIComponent(appId)}&token=${encodeURIComponent(token)}`;
    }
    window.location.replace(target);
  </script>
</head>
<body style="background:#0F172A; color:#F8FAFC; font-family:sans-serif; text-align:center; padding-top:100px;">
  <h2>جاري تحويلك إلى حسابك في بوابة الطلاب...</h2>
  <p><a href="portal.html" style="color:#3B82F6;">اضغط هنا إذا لم يتم التحويل تلقائياً</a></p>
</body>
</html>
